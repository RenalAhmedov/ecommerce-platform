# Single entry point: /api/* goes to the Nest api-gateway, everything else
# (admin panel, its JSON API under /admin/api, assets, product images) to Laravel.

# Docker's DNS, so a recreated container (new IP) is found again without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_gateway {
    zone api_gateway 64k;
    server api-gateway:3000 resolve;
    keepalive 16;
}

upstream admin_service {
    zone admin_service 64k;
    server admin-service:8000 resolve;
    keepalive 16;
}

# The same id appears in this access log and in both apps' logs. Nginx is the
# edge, so it always assigns its own and ignores whatever a client sends.
log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                '${request_time}s upstream=$upstream_addr request=$request_id';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    server_tokens off;

    # Product images are up to 5 MB, CSV imports up to 2 MB (both validated by the app).
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # $http_host keeps the port the browser used (localhost:8080), so redirect and image URLs keep it too.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replaced, not appended to: a client can't pose as another IP to dodge rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_gateway;
    }

    location / {
        proxy_pass http://admin_service;
    }
}
