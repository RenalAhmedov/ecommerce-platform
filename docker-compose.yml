name: ecommerce-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

  # The single entry point: http://localhost:8080 (/api → api-gateway, everything else → admin-service).
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api-gateway:
        condition: service_healthy
      admin-service:
        condition: service_started

  # Runs the Nest migrations once and exits. Nest owns the shared schema, so
  # both apps (and the admin service's own migrations) wait for it to succeed.
  api-migrate:
    build:
      context: ./api-gateway
      target: dev
    image: ecommerce-platform-api-gateway-dev
    command: ["npm", "run", "migration:run"]
    volumes: &api-gateway-volumes
      - ./api-gateway:/app
      # Linux packages stay in a volume, never mixed with a node_modules installed on the host.
      - api-gateway-node-modules:/app/node_modules
    # Overrides the host-oriented values in api-gateway/.env (real environment variables win over .env).
    environment: &api-gateway-environment
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ecommerce}
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    image: ecommerce-platform-api-gateway-dev
    build:
      context: ./api-gateway
      target: dev
    restart: unless-stopped
    volumes: *api-gateway-volumes
    environment: *api-gateway-environment
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Watch mode compiles everything before it listens.
      start_period: 90s
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The admin service's own tables (password resets, failed jobs, imports). Runs
  # after Nest's migrations and installs the PHP packages first when needed.
  admin-migrate:
    build:
      context: ./admin-service
      target: dev
    image: ecommerce-platform-admin-service
    command: ["sh", "-c", "composer install --no-interaction --no-progress --quiet && php artisan migrate --force"]
    volumes:
      - ./admin-service:/var/www/html
    depends_on:
      api-migrate:
        condition: service_completed_successfully

  admin-service: &admin-service
    build:
      context: ./admin-service
      target: dev
    image: ecommerce-platform-admin-service
    restart: unless-stopped
    volumes:
      - ./admin-service:/var/www/html
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8000}:8000"
    environment:
      NEST_API_URL: http://api-gateway:3000
    depends_on:
      admin-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Development: queue:listen reloads the code for every job. Production uses queue:work.
  admin-worker:
    <<: *admin-service
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=60"]
    ports: []

  # Test runner only, never started by `up`:
  #   docker compose run --rm admin-tests                      (all tests)
  #   docker compose run --rm admin-tests --testsuite=Unit     (any `php artisan test` options)
  # On a fresh clone it creates .env from .env.example and installs the PHP dependencies first.
  # The Docker socket lets Testcontainers start throwaway Postgres/Redis, which
  # are reached through the host; the app containers above get no socket access.
  admin-tests:
    image: ecommerce-platform-admin-service
    build:
      context: ./admin-service
      target: dev
    profiles: ["test"]
    entrypoint: ["sh", "-c", "[ -f .env ] || cp .env.example .env; composer install --no-interaction --no-progress --quiet && exec php artisan test \"$$@\"", "--"]
    command: []
    volumes:
      - ./admin-service:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Builds the panel's CSS/JS into admin-service/public/build (`docker compose run --rm admin-assets`).
  # node_modules lives in its own volume, so it never mixes Linux packages into
  # a node_modules folder installed on the host (macOS/Windows) and vice versa.
  admin-assets:
    image: node:24-alpine
    profiles: ["tools"]
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]
    volumes:
      - ./admin-service:/app
      - admin-node-modules:/app/node_modules

volumes:
  postgres-data:
  redis-data:
  api-gateway-node-modules:
  admin-node-modules:
