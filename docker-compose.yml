name: ecommerce-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ecommerce}
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

  admin-service: &admin-service
    build: ./admin-service
    image: ecommerce-platform-admin-service
    restart: unless-stopped
    volumes:
      - ./admin-service:/var/www/html
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-worker:
    <<: *admin-service
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=60"]
    ports: []

  # Test runner only (`docker compose run --rm admin-tests`); never started by `up`.
  # The Docker socket lets Testcontainers start throwaway Postgres/Redis, which
  # are reached through the host; the app containers above get no socket access.
  admin-tests:
    image: ecommerce-platform-admin-service
    build: ./admin-service
    profiles: ["test"]
    command: ["php", "artisan", "test"]
    volumes:
      - ./admin-service:/var/www/html
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
