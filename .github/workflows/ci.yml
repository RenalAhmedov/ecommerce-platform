# CI on every pull request and push to main: both services are linted, type-
# checked and tested (integration tests start their own Postgres, Redis and
# Elasticsearch with Testcontainers on the runner's Docker). CD on main only,
# once everything passed: both production images are built and pushed to
# GitHub's container registry. Actions are pinned to commit SHAs (a tag can be
# moved, a commit can't); Dependabot keeps them up to date.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Compose and Nginx config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the compose files
        run: |
          # The production stack reads the services' .env files.
          cp api-gateway/.env.example api-gateway/.env
          cp admin-service/.env.example admin-service/.env
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate the Nginx config
        run: >
          docker run --rm
          -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
          --add-host api-gateway:127.0.0.1 --add-host admin-service:127.0.0.1 --add-host reverb:127.0.0.1
          nginx:1.28-alpine nginx -t

  api-gateway:
    name: api-gateway (Nest.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: api-gateway/.nvmrc
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Formatting
        run: npx prettier --check "src/**/*.ts"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Integration tests
        run: npm run test:integration
      - name: Production build
        run: npm run build

  admin-service:
    name: admin-service (Laravel)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip, gd, bcmath, pcntl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Code style
        run: vendor/bin/pint --test
      - name: Unit and integration tests
        run: |
          cp .env.example .env
          php artisan test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-service/package-lock.json
      - name: Frontend build
        run: npm ci --no-audit --no-fund && npm run build

  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [infrastructure, api-gateway, admin-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, admin-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ecommerce-platform-${{ matrix.service }}
          # The commit it was built from, and "latest" for the newest main.
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
